[project]
name = "quant-research-onboarding"
version = "0.1.0"
description = "可复现的中文量化研究入门学习站与沪深300三因子教学管线"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
authors = [{ name = "Quant Research Onboarding Contributors" }]
dependencies = [
  "beautifulsoup4==4.14.3",
  "ipykernel==7.2.0",
  "matplotlib==3.10.8",
  "nbclient==0.10.4",
  "nbformat==5.10.4",
  "numpy==2.4.2",
  "pandas==3.0.1",
  "pyarrow==23.0.1",
  "scipy==1.17.1",
  "statsmodels==0.14.6",
  "tushare==1.4.24",
]

[dependency-groups]
dev = [
  "coverage[toml]==7.13.4",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.15.4",
]

[project.scripts]
quant-onboarding = "quant_onboarding.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_onboarding"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["quant_onboarding"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
