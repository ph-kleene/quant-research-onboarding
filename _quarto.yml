project:
  type: website
  output-dir: _site
  render:
    - content/index.qmd
    - content/factor-intro.qmd
    - content/case-study.qmd
    - content/failure-lab.qmd
    - content/credibility.qmd
    - content/practice.qmd
    - content/research-map.qmd
    - content/glossary.qmd
    - content/references.qmd
    - content/self-test.qmd
    - content/english-summary.qmd
    - notebooks/research-case.ipynb

website:
  title: "量化研究入门"
  description: "通过一次真实的沪深300多因子研究，学会判断回测结论是否可信。"
  site-url: "https://ph-kleene.github.io/quant-research-onboarding/"
  repo-url: "https://github.com/ph-kleene/quant-research-onboarding"
  repo-actions: [source, issue]
  navbar:
    background: "#102a43"
    foreground: "#f8fafc"
    left:
      - href: content/index.qmd
        text: 首页
      - text: 学习路径
        menu:
          - href: content/factor-intro.qmd
            text: 10 分钟理解因子
          - href: content/case-study.qmd
            text: 跟做一次研究
          - href: content/failure-lab.qmd
            text: 回测陷阱实验室
          - href: content/credibility.qmd
            text: 可信度六问
      - href: content/practice.qmd
        text: 动手实践
      - text: 参考
        menu:
          - href: content/glossary.qmd
            text: 知识库
          - href: notebooks/research-case.html
            text: 研究 Notebook
          - href: content/research-map.qmd
            text: 20 步研究地图
          - href: content/self-test.qmd
            text: 八步自测
          - href: content/references.qmd
            text: 参考文献
          - href: content/english-summary.qmd
            text: 英文摘要
    sidebar:
      style: docked
      search: true
      contents:
        - section: "学习路径"
          contents:
            - content/index.qmd
            - content/factor-intro.qmd
            - content/case-study.qmd
            - content/failure-lab.qmd
            - content/credibility.qmd
            - content/practice.qmd
        - section: "工具与参考"
          contents:
            - text: 知识库与工具箱
              href: content/glossary.qmd
            - content/research-map.qmd
            - content/self-test.qmd
            - content/references.qmd
            - content/english-summary.qmd
    page-footer:
      left: "教学用途，不构成投资建议。"
      right: "数据、代码、配置与证据共同决定结论。"

lang: zh

format:
  html:
    theme: cosmo
    css: assets/styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: true
    fig-responsive: true

execute:
  freeze: auto
  echo: true
  warning: false
  error: false

bibliography: references.bib
